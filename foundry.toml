[profile.default]
src = "contracts"
test = "test"
script = "scripts"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"          # safe across Polygon Amoy + Anvil
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]
gas_reports = ["DonationLedger", "SignatoryRegistry", "CaseWorkflow", "PeriodAnchor", "IntegrityMonitor"]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
int_types = "long"

[profile.ci]
verbosity = 4
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 32 }

[rpc_endpoints]
amoy = "${AMOY_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", chain = 80002, url = "https://api-amoy.polygonscan.com/api" }
